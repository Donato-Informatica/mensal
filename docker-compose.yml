# Local development and integration-test database. Postgres is pinned to the production major (PRD §8.3).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mensal
      POSTGRES_PASSWORD: mensal
      POSTGRES_DB: mensal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensal -d mensal"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Grafana, Loki, Tempo and a Collector in one image, for browsing the API's
  # telemetry locally without an account (PRD §8.7.4). Grafana is on :3001;
  # point OTEL_EXPORTER_OTLP_ENDPOINT at http://localhost:4318.
  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - "3001:3000"
      - "4318:4318"

volumes:
  postgres-data:
