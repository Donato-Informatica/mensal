# Local development and integration-test database. Postgres is pinned to the production major (PRD §8.3).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mensal
      POSTGRES_PASSWORD: mensal
      POSTGRES_DB: mensal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensal -d mensal"]
      interval: 2s
      timeout: 5s
      retries: 15

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres-data:
