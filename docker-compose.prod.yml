# Production stack for Coolify (PRD §8.4): Postgres, the API and the web app.
# In Coolify: new resource -> Docker Compose, compose file `/docker-compose.prod.yml`,
# then set the domain of the `web` service. Only `web` is public; it serves the
# static frontend and forwards /api to the API, so the browser sees one origin.
#
# Coolify fills the SERVICE_* magic variables: passwords are generated once
# and kept, SERVICE_URL_WEB is the domain you assign to `web`.
#
# Preview deployments (one stack per pull request) share this compose project
# with production, and Coolify renames their services (`api` -> `api-pr-42`).
# So services reach each other through aliases that are unique per stack, built
# from COOLIFY_FQDN (the stack's own domain, set per deploy), never through the
# bare service names `postgres` and `api`, which could resolve to another stack.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mensal
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: mensal
    networks:
      default:
        aliases:
          - mensal-db.${COOLIFY_FQDN:-prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mensal -d mensal"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://mensal:${SERVICE_PASSWORD_POSTGRES}@mensal-db.${COOLIFY_FQDN:-prod}:5432/mensal
      # Must be the https:// origin of `web` (the API refuses to boot otherwise).
      # A preview's own origin is COOLIFY_URL; SERVICE_URL_WEB would be the
      # service's default domain, and Better-Auth rejects any other origin.
      BETTER_AUTH_URL: ${COOLIFY_URL:-${SERVICE_URL_WEB}}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH}
      PORT: 3000
      # Set both in Coolify to send email through Resend, or neither to print
      # emails to the container log (ADR-0003). One without the other fails boot.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    networks:
      default:
        aliases:
          - mensal-api.${COOLIFY_FQDN:-prod}
    # TEMPORARY DEBUG (preview boot failure): print what the API sees, run the
    # normal start, and on failure print the exit code and stay alive so the
    # logs stay reachable from the Coolify UI. Revert before merging.
    command:
      - sh
      - -c
      - |
        echo "[debug] BETTER_AUTH_URL=$$BETTER_AUTH_URL PORT=$$PORT NODE_ENV=$$NODE_ENV"
        echo "[debug] DATABASE_URL=$$(echo "$$DATABASE_URL" | sed 's#//[^@]*@#//***@#')"
        echo "[debug] secret length=$${#BETTER_AUTH_SECRET} resend key set=$${RESEND_API_KEY:+yes} EMAIL_FROM=$$EMAIL_FROM"
        db_host=$$(echo "$$DATABASE_URL" | sed 's#.*@\([^:/]*\).*#\1#')
        echo "[debug] db host=$$db_host resolves to: $$(getent hosts "$$db_host" || echo NOT-RESOLVED)"
        : "$${DATABASE_URL:?is not set}" && npm run --silent -w @mensal/database migrate && node apps/api/src/server.ts
        echo "[debug] API exited with code $$?"
        sleep 3600
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      - SERVICE_URL_WEB_80
      # The host nginx forwards /api to (see apps/web/nginx.conf.template).
      - API_HOST=mensal-api.${COOLIFY_FQDN:-prod}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
