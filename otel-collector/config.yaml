# OpenTelemetry Collector (PRD §8.7.4, ADR-0007). The only file that knows the
# backend is Grafana Cloud; moving to self-hosted Grafana/Loki/Tempo changes
# the exporter and extension here and nothing in the apps.
#
# Credentials come from Coolify variables (no defaults):
#   GRAFANA_CLOUD_OTLP_ENDPOINT, GRAFANA_CLOUD_INSTANCE_ID, GRAFANA_CLOUD_API_TOKEN

extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_CLOUD_API_TOKEN}

receivers:
  # The API sends over the internal network; browsers via nginx's /otlp.
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Redaction, layer two (PRD §8.7.2): the SDKs already avoid these.
  attributes/headers:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.set-cookie
        action: delete
      - key: http.response.header.authorization
        action: delete
      - key: http.response.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete

  # URL query strings and fragments, in every attribute that holds a URL.
  transform/query_strings:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.attributes["url.full"], "[?#].*$", "")
          - replace_pattern(span.attributes["http.url"], "[?#].*$", "")
          - replace_pattern(span.attributes["http.target"], "[?#].*$", "")
          - replace_pattern(span.attributes["url.path"], "[?#].*$", "")
    log_statements:
      - context: log
        statements:
          - replace_pattern(log.attributes["url.full"], "[?#].*$", "")
          - replace_pattern(log.attributes["http.url"], "[?#].*$", "")
          - replace_pattern(log.attributes["url.path"], "[?#].*$", "")

  # Browser ingest is public and unauthenticated: anything outside these lists
  # is dropped from browser (mensal-web) spans, span events and logs.
  transform/browser_allowlist:
    error_mode: ignore
    trace_statements:
      - context: span
        conditions:
          - resource.attributes["service.name"] == "mensal-web"
        statements:
          - keep_matching_keys(span.attributes, "^(http\\.method|http\\.url|http\\.status_code|http\\.status_text|http\\.host|http\\.scheme|http\\.user_agent|http\\.response_content_length|http\\.response_content_length_uncompressed|http\\.request\\.method|http\\.response\\.status_code|url\\.full|url\\.path|url\\.scheme|server\\.address|server\\.port|user_agent\\.original|error\\.type|component|exception\\.type)$")
      - context: spanevent
        conditions:
          - resource.attributes["service.name"] == "mensal-web"
        statements:
          - keep_matching_keys(spanevent.attributes, "^(exception\\.type)$")
    log_statements:
      - context: log
        conditions:
          - resource.attributes["service.name"] == "mensal-web"
        statements:
          - keep_matching_keys(log.attributes, "^(url\\.path|exception\\.type)$")

  batch:

exporters:
  otlphttp/grafana:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors:
        [
          attributes/headers,
          transform/query_strings,
          transform/browser_allowlist,
          batch,
        ]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors:
        [
          attributes/headers,
          transform/query_strings,
          transform/browser_allowlist,
          batch,
        ]
      exporters: [otlphttp/grafana]
