# Browser telemetry ingest limits (PRD §8.7.4). Coolify's proxy is the peer, so
# $remote_addr is the same for everyone: key on the last X-Forwarded-For entry,
# the address that proxy itself appended (a client-sent prefix cannot spoof it).
map $http_x_forwarded_for $otlp_client {
  default $remote_addr;
  "~(?<last>[^,\s]+)\s*$" $last;
}
limit_req_zone $otlp_client zone=otlp:1m rate=60r/m;

server {
  listen 80;
  root /usr/share/nginx/html;

  # Browser telemetry (PRD §8.7.4): forwarded to the Collector, which serves
  # /v1/traces and /v1/logs at its root, so the prefix is stripped. Public and
  # unauthenticated, hence the rate and size limits. A variable in proxy_pass
  # makes nginx resolve the name per request instead of at startup: with the
  # Collector stopped or absent nginx still boots and the app is unaffected.
  location /otlp/ {
    limit_except POST {
      deny all;
    }
    limit_req zone=otlp burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 256k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $collector http://otel-collector:4318;
    rewrite ^/otlp/(.*)$ /$1 break;
    proxy_pass $collector;
    proxy_connect_timeout 2s;
    proxy_set_header Host $host;
  }

  # Same origin as the SPA (PRD §8.4): no CORS. Coolify's proxy sits in front
  # and sets X-Forwarded-*; pass them on, since Better-Auth rate-limits by the
  # client IP in x-forwarded-for (PRD §8.6).
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The PWA files keep their names across versions: never cached, or clients
  # stay stuck on an old service worker (PRD §8.4, ADR-0006).
  location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
    # nginx's mime.types has no entry for .webmanifest.
    types {
      application/javascript js;
      application/manifest+json webmanifest;
    }
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # The guide (PRD §7.17, §8.4): a static page apart from the app, never the
  # single-page fallback. Its HTML is revalidated on every visit; its hashed
  # assets never change. The redirect stays relative, so it keeps the scheme
  # and host the proxy in front was reached on.
  location = /guia {
    absolute_redirect off;
    return 301 /guia/;
  }

  location /guia/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /guia/ {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }

  # Single-page app: unknown paths go to the client router.
  location / {
    try_files $uri /index.html;
  }
}
