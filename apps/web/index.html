<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <script>
      // First paint, before the app loads (PRD §3.5): the theme this device
      // last applied, or Escuro without one. The app keeps it under the same
      // key (src/color-scheme.ts) and the canvases are theme.ts's.
      (function () {
        var canvas = { dark: "#0a0a0a", light: "#f5f5f5" };
        var scheme = "dark";
        try {
          var cached = localStorage.getItem("mensal-color-scheme");
          if (cached === "light" || cached === "dark") scheme = cached;
          if (cached === "auto") {
            var dark = matchMedia("(prefers-color-scheme: dark)").matches;
            scheme = dark ? "dark" : "light";
          }
        } catch (e) {}
        document.documentElement.setAttribute(
          "data-mantine-color-scheme",
          scheme
        );
        document
          .querySelector('meta[name="color-scheme"]')
          .setAttribute("content", scheme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", canvas[scheme]);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Mensal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
